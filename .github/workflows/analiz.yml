name: analiz

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analizi sentetik veriyle çalıştır
        run: python analysis/python/kusak_analiz.py --n-boot 200

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::psych
      - name: CFA / SEM'i sentetik veriyle çalıştır
        run: Rscript analysis/R/cfa_sem.R
